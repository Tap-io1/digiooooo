<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digio Parfumerie | Περιστέρι</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #081B45;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }


        /* =========================
           FLOATING PERFUME BOTTLES
           ========================= */

        .perfume {
            position: fixed;
            width: 42px;
            height: 58px;

            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 9px 9px 13px 13px;

            background: rgba(255, 255, 255, 0.025);

            opacity: 0.55;

            z-index: 0;
            pointer-events: none;
        }


        .perfume::before {
            content: "";

            position: absolute;

            width: 18px;
            height: 9px;

            top: -11px;
            left: 10px;

            border: 2px solid rgba(255, 255, 255, 0.08);
            border-bottom: none;

            border-radius: 4px 4px 0 0;

            background: rgba(255, 255, 255, 0.025);
        }


        .perfume::after {
            content: "";

            position: absolute;

            width: 22px;
            height: 2px;

            left: 8px;
            top: 25px;

            background: rgba(255, 255, 255, 0.07);
        }


        /* Bottle 1 */

        .p1 {
            left: 5%;
            top: 12%;

            transform: rotate(-18deg);

            animation: float1 7s ease-in-out infinite;
        }


        /* Bottle 2 */

        .p2 {
            right: 6%;
            top: 18%;

            width: 35px;
            height: 52px;

            transform: rotate(17deg);

            animation: float2 8s ease-in-out infinite;
        }


        /* Bottle 3 */

        .p3 {
            left: 7%;
            bottom: 18%;

            width: 48px;
            height: 62px;

            transform: rotate(12deg);

            animation: float3 9s ease-in-out infinite;
        }


        /* Bottle 4 */

        .p4 {
            right: 7%;
            bottom: 14%;

            width: 44px;
            height: 60px;

            transform: rotate(-15deg);

            animation: float4 8s ease-in-out infinite;
        }


        /* Bottle 5 */

        .p5 {
            left: 19%;
            top: 5%;

            width: 30px;
            height: 44px;

            transform: rotate(25deg);

            animation: float5 10s ease-in-out infinite;
        }


        /* Bottle 6 */

        .p6 {
            right: 20%;
            bottom: 5%;

            width: 32px;
            height: 48px;

            transform: rotate(-22deg);

            animation: float6 9s ease-in-out infinite;
        }


        /* =========================
           FLOATING ANIMATIONS
           ========================= */

        @keyframes float1 {

            0%, 100% {
                transform: translateY(0) rotate(-18deg);
            }

            50% {
                transform: translateY(-18px) rotate(-12deg);
            }
        }


        @keyframes float2 {

            0%, 100% {
                transform: translateY(0) rotate(17deg);
            }

            50% {
                transform: translateY(20px) rotate(24deg);
            }
        }


        @keyframes float3 {

            0%, 100% {
                transform: translateY(0) rotate(12deg);
            }

            50% {
                transform: translateY(-15px) rotate(18deg);
            }
        }


        @keyframes float4 {

            0%, 100% {
                transform: translateY(0) rotate(-15deg);
            }

            50% {
                transform: translateY(18px) rotate(-8deg);
            }
        }


        @keyframes float5 {

            0%, 100% {
                transform: translateY(0) rotate(25deg);
            }

            50% {
                transform: translateY(-12px) rotate(18deg);
            }
        }


        @keyframes float6 {

            0%, 100% {
                transform: translateY(0) rotate(-22deg);
            }

            50% {
                transform: translateY(14px) rotate(-15deg);
            }
        }


        /* =========================
           MAIN CONTAINER
           ========================= */

        .container {
            width: 100%;
            max-width: 480px;

            text-align: center;

            position: relative;
            z-index: 2;
        }


        /* =========================
           HEADER
           ========================= */

        .header {
            margin-bottom: 30px;
        }


        .logo {
            width: 100%;
            max-width: 400px;
            height: auto;

            display: block;

            margin: 0 auto 20px auto;
        }


        .header p {
            font-size: 0.95rem;

            color: #d6d6d6;

            letter-spacing: 1px;
        }


        /* =========================
           BUTTONS
           ========================= */

        .links-container {
            display: flex;
            flex-direction: column;

            gap: 16px;
        }


        .btn {
            display: block;

            width: 100%;

            padding: 16px 20px;

            /* Slightly darker blue than background */
            background-color: #061536;

            /* Gold text */
            color: #D4AF37;

            text-decoration: none;

            font-size: 1.05rem;

            font-weight: 600;

            /* Gold outline */
            border-radius: 10px;

            border: 1px solid #D4AF37;

            transition: all 0.3s ease;

            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.25);
        }


        /* =========================
           BUTTON HOVER
           ========================= */

        .btn:hover {

            background-color: #0A1F4A;

            color: #E6C65C;

            border-color: #E6C65C;

            transform: translateY(-2px);

            box-shadow:
                0 0 12px rgba(212, 175, 55, 0.25),
                0 6px 14px rgba(0, 0, 0, 0.3);
        }


        .btn:active {
            transform: translateY(0);
        }


        /* =========================
           FOOTER
           ========================= */

        .footer {

            margin-top: 40px;

            font-size: 0.8rem;

            color: #cfcfcf;

            opacity: 0.7;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .perfume {
                opacity: 0.4;
            }

            .p5,
            .p6 {
                display: none;
            }

            .logo {
                max-width: 360px;
            }

        }

    </style>

</head>


<body>
